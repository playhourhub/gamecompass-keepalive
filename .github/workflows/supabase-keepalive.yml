name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent auto-pause
        run: |
          HTTP_CODE=$(curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            --silent --max-time 20 \
            --write-out "%{http_code}" \
            --output /dev/null)
          echo "HTTP response: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 600 ]; then
            echo "Supabase is active (HTTP $HTTP_CODE) - project stays alive."
          else
            echo "Error: no valid HTTP response (code: $HTTP_CODE)"
            exit 1
          fi
